# Codex configuration for {{PROJECT_NAME}}.
# Fragments under codex/configs/ are concatenated (in name order) into
# .codex/config.toml on every sync — edit them here, never the generated file.
#
# The project must be TRUSTED: Codex ignores a project's .codex/ layer
# (config, agents) until you accept the trust prompt on first `codex` run.
#
# Agents: sync writes one .codex/agents/<name>.toml per role, which Codex
# auto-discovers. There's no agent picker — ask Codex to delegate ("spawn the
# architect agent to plan X"). Codex doesn't self-delegate, so be explicit.
#
# Model: deliberately unset. Codex uses its default for your sign-in, and each
# agent inherits the parent session's model; the role files pin only reasoning
# effort. Pinning a slug here or in an agent goes stale when models are renamed
# or retired, and an unknown slug stops agents from starting. To pin anyway, use
# an exact slug your `codex` lists under /model.
# model = "<exact slug from /model>"

# Multi-repo workspace (the root isn't a git repo): Codex treats the nearest
# `.git` as the project root, so launching inside a sub-repo skips this
# workspace-level config and AGENTS.md. Run `codex` from the workspace root.
