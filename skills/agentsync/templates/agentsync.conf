# agentsync configuration. Sourced by the sync scripts.

# The agentsync version that last generated/reconciled this project. agentsync
# reads this on reconcile and applies the enhancements of any newer version
# (see "Upgrades by version" in the skill). Don't hand-edit — agentsync owns it.
AGENTSYNC_VERSION="{{AGENTSYNC_VERSION}}"

# Surfaces to generate, space- or comma-separated: claude codex opencode github.
# Unset (pre-0.3.0 projects) means "every surface whose agents/<surface>/ dir exists".
SURFACES="{{SURFACES}}"

# Where the Claude system prompt is written, relative to workspace root.
# Default: .claude/CLAUDE.md   |   Common alternative: CLAUDE.md (repo root)
CLAUDE_MD_TARGET=".claude/CLAUDE.md"

# Which generated output git tracks. agentsync keeps a marked block in the
# workspace .gitignore in sync with this.
#   all        commit everything generated
#   root-docs  commit entrypoint docs (CLAUDE.md, AGENTS.md, copilot-instructions);
#              gitignore the bulky regenerable dirs (.claude/, .codex/, .opencode/,
#              .github/agents/, .github/skills/, .agents/)
#   none       gitignore all generated output; track only agents/
OUTPUT_TRACKING="root-docs"

# Codex shells don't load a project's direnv/Nix environment, so tools look
# "missing". When set, generated Codex agents run commands through this prefix
# (`cd <dir> && cmd` becomes `cd <dir> && <prefix> cmd`, plus a standing note).
# Bootstrap sets it to "direnv exec ." when the project has an .envrc.
CODEX_EXEC_PREFIX=""

# Also register each Codex agent under [agents.<name>] in .codex/config.toml.
# Only needed for older Codex releases that don't auto-discover .codex/agents/.
CODEX_REGISTER_ROLES="no"
